name: Deploy

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'Branch to build'
        required: true
        default: 'master'
      SERVER_TO_DEPLOY:
        description: 'Target server'
        required: true
        default: 'ec2-instance'
        type: choice
        options:
          - ec2-instance
          - test-instance

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_IMAGE: node:22.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.BRANCH }}

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Vue App inside Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app/front $NODE_IMAGE sh -c "npm install && npm run build"

      - name: Set Deployment Variables
        id: set-vars
        run: |
          echo "Selecting server to deploy to: ${{ github.event.inputs.SERVER_TO_DEPLOY }}"
          if [ "${{ github.event.inputs.SERVER_TO_DEPLOY }}" = "ec2-instance" ]; then
            echo "host=${{ secrets.EC2_INSTANCE_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.EC2_INSTANCE_USER }}" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.TEST_INSTANCE_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.TEST_INSTANCE_USER }}" >> $GITHUB_OUTPUT
          fi

      - name: Compress Vue dist folder
        run: |
          tar -czf vue-dist.tar.gz -C front/dist .

      - name: Upload tarball to /tmp on EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.set-vars.outputs.host }}
          username: ${{ steps.set-vars.outputs.user }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "vue-dist.tar.gz"
          target: "/tmp"

      - name: Extract dist into /var/www/html on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.set-vars.outputs.host }}
          username: ${{ steps.set-vars.outputs.user }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo tar -xzf /tmp/vue-dist.tar.gz -C /var/www/html
            rm -f /tmp/vue-dist.tar.gz
            sudo systemctl restart httpd

      - name: Clean local tarball
        run: rm -f vue-dist.tar.gz